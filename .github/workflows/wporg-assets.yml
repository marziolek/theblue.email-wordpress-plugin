name: WordPress.org readme and assets

# A change to readme.txt or .wordpress-org/ on main reaches the directory
# without a new release (e.g. "Tested up to" after a WordPress release).

on:
  push:
    branches: [main]
    paths: ['readme.txt', '.wordpress-org/**']

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: theblue-email-forms
          ASSETS_DIR: .wordpress-org
          IGNORE_OTHER_FILES: true
