<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plugin banner</title>
<!--
	The WordPress.org banner. 772x250 CSS pixels: captured at 1x for
	banner-772x250.png and at 2x for banner-1544x500.png. See README.md here.
-->
<style>
	@font-face {
		font-family: 'Instrument Sans';
		font-weight: 400 700;
		font-stretch: 75% 100%;
		src: url('../../assets/fonts/instrument-sans-latin.woff2') format('woff2');
	}
	@font-face {
		font-family: 'Source Code Pro';
		font-weight: 200 900;
		src: url('fonts/source-code-pro-latin.woff2') format('woff2');
	}

	:root {
		--stage: #0f1f96;
		--soft: #c6cfff;
		--ink: #0a1238;
		--slate: #55607f;
		--line: #dde3f3;
		--paper: #ffffff;
	}

	* { box-sizing: border-box; margin: 0; }

	html, body {
		width: 772px;
		height: 250px;
		overflow: hidden;
		background: var(--stage);
	}

	body {
		position: relative;
		font-family: 'Instrument Sans', system-ui, sans-serif;
		color: #fff;
		-webkit-font-smoothing: antialiased;
	}

	.wordmark {
		position: absolute;
		left: 48px;
		top: 30px;
		height: 19px;
		width: auto;
	}

	/* The one bold thing: the site's hero treatment. */
	h1 {
		position: absolute;
		left: 44px;
		top: 82px;
		font-size: 73px;
		font-weight: 600;
		font-stretch: 80%;
		letter-spacing: -0.03em;
		line-height: 0.94;
	}

	.shortcode {
		position: absolute;
		left: 486px;
		top: 33px;
		font-family: 'Source Code Pro', monospace;
		font-size: 10.5px;
		color: var(--soft);
		letter-spacing: -0.01em;
	}

	/* A placed form, running off the bottom edge like the site's product shot. */
	.form {
		position: absolute;
		left: 486px;
		top: 60px;
		width: 238px;
		height: 230px;
		padding: 20px 20px 0;
		background: var(--paper);
		border-radius: 14px;
		color: var(--ink);
	}

	.form h2 {
		font-size: 25px;
		font-weight: 600;
		font-stretch: 80%;
		letter-spacing: -0.025em;
		line-height: 1;
	}

	.form p {
		margin-top: 6px;
		font-size: 11.5px;
		line-height: 1.35;
		color: var(--slate);
	}

	.field {
		margin-top: 14px;
		height: 32px;
		padding: 0 12px;
		border: 1px solid var(--line);
		border-radius: 8px;
		font-size: 11.5px;
		line-height: 30px;
		color: #8a93b0;
	}

	.button {
		margin-top: 8px;
		height: 32px;
		border-radius: 999px;
		background: var(--stage);
		color: #fff;
		font-size: 12px;
		font-weight: 600;
		line-height: 32px;
		text-align: center;
	}
</style>
</head>
<body>
	<img class="wordmark" src="../../assets/images/wordmark-on-stage.svg" alt="theblue.email">

	<h1>Signup forms<br>for WordPress</h1>

	<div class="shortcode">[theblue_email_form key="7f3a9c21e04b"]</div>

	<div class="form">
		<h2>The Friday letter</h2>
		<p>Five links worth your weekend.</p>
		<div class="field">you@example.com</div>
		<div class="button">Subscribe</div>
	</div>
</body>
</html>
