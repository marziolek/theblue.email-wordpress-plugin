name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, openssl, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint every PHP file
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Versions agree
        run: php bin/check-versions.php

      - name: Unit tests
        run: vendor/bin/phpunit

      - name: WordPress Coding Standards
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs

      - name: PHPStan
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --memory-limit=-1 --no-progress

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: for f in assets/js/*.js assets/admin/*.js blocks/form/editor.js; do node --check "$f"; done
      - name: Proof-of-work solver matches SHA-256
        run: node --test tests/js/pow.test.js

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the distributable
        run: bin/build-zip.sh
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/theblue-email-forms
